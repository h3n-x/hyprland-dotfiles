# ============================================================================
# qt5ct -- plantilla del instalador (install/lib/qt.sh la copia a ~/.config/qt5ct/qt5ct.conf
# solo si no existe; despues el archivo es tuyo: qt5ct lo reescribe al guardar).
# Paleta dinamica via matugen (colors/matugen.conf, ver matugen/.config/matugen/templates/
# qt-colors.conf). color_scheme_path va con ruta absoluta porque qt5ct no expande "~": el
# instalador cambia @HOME@ por tu home y `doctor` revisa que siga apuntando ahi.
# style=Fusion porque respeta el QPalette custom; Kvantum/otros estilos lo ignoran.
# ============================================================================

[Appearance]
color_scheme_path=@HOME@/.config/qt5ct/colors/matugen.conf
custom_palette=true
icon_theme=Papirus-Dark
standard_dialogs=default
style=Fusion

[Fonts]
# Fuentes del design system (D1, P1.3), formato QFont::toString() de Qt 5.
general="Plus Jakarta Sans,10,-1,5,50,0,0,0,0,0"
fixed="Maple Mono NF,10,-1,5,50,0,0,0,0,0"
