# ============================================================================
# kitty terminal
# ============================================================================

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Fallback dedicado para glifos de Nerd Font que JetBrainsMono Nerd Font no
# cubra bien -- rango recomendado oficial (ver ~/Documents/kitty.txt).
symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

cursor_shape     beam
cursor_blink_interval 0
# Estela sutil del cursor -- sigue el color del cursor (ya viene de matugen)
cursor_trail 3
cursor_trail_decay 0.1 0.4
scrollback_lines  10000

window_padding_width 10
confirm_os_window_close 0

background_opacity 0.92
dynamic_background_opacity yes

enable_audio_bell no
allow_remote_control yes
shell_integration enabled

allow_hyperlinks yes
detect_urls yes
underline_hyperlinks hover

# ---- Tab bar: powerline redondeado, colores en colors.conf (matugen) ----
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_align left
tab_title_template " {title} "

# GPU: kitty usa OpenGL, se beneficia de correr en la iGPU (activa por
# defecto via AQ_DRM_DEVICES). No hace falta nada especial aca.

# ---- Tema (generado por matugen, ../../matugen/.config/matugen/templates/kitty.conf) ----
include colors.conf

# ---- Atajos utiles ----
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0

# ---- Layouts / splits ----
# splits primero = layout por defecto. ctrl+shift+] / [ (default de kitty)
# cicla entre paneles, ctrl+shift+l cicla de layout, ambos sin config extra.
enabled_layouts splits,tall,stack
map ctrl+shift+enter    launch --location=vsplit --cwd=current
map ctrl+shift+backslash launch --location=hsplit --cwd=current
map ctrl+shift+z        toggle_layout stack

# ---- Explorador de archivos con preview (yazi) en un split ----
map ctrl+shift+f launch --location=vsplit --cwd=current yazi
