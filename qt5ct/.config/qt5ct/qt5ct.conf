# ============================================================================
# qt5ct -- paleta dinamica via matugen (colors/matugen.conf, ver
# ../../matugen/.config/matugen/templates/qt-colors.conf). color_scheme_path
# usa ruta absoluta porque qt5ct no expande "~" en este campo; asume
# $HOME=/home/h3n, igual que el resto del repo (ver README, seccion GPU).
# style=Fusion porque respeta el QPalette custom; Kvantum/otros estilos lo ignoran.
# ============================================================================

[Appearance]
color_scheme_path=/home/h3n/.config/qt5ct/colors/matugen.conf
custom_palette=true
icon_theme=AnimeZen
standard_dialogs=default
style=Fusion

[Fonts]
# Fuentes del design system (D1, P1.3), formato QFont::toString() de Qt 5.
general="Plus Jakarta Sans,10,-1,5,50,0,0,0,0,0"
fixed="Maple Mono NF,10,-1,5,50,0,0,0,0,0"
