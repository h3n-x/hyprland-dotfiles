# Generado por matugen -- no editar a mano, editar templates/hyprlock.conf
# Formato hyprlang: variables $nombre, sourceadas desde hyprlock.conf.
# Hyprlang sustituye variables por nombre completo (no concatena $primary + "FF"
# a mano), asi que cada combinacion color+alpha que usa hyprlock.conf tiene
# su propia variable ya resuelta aca.
$primaryFF   = {{colors.primary.default.hex_stripped}}ff
$primary80   = {{colors.primary.default.hex_stripped}}80
$primary40   = {{colors.primary.default.hex_stripped}}40
$primaryAA   = {{colors.primary.default.hex_stripped}}aa
$primaryContainerFF = {{colors.primary_container.default.hex_stripped}}ff
$onPrimaryFF = {{colors.on_primary.default.hex_stripped}}ff
$onPrimary   = {{colors.on_primary.default.hex_stripped}}
$surfaceE6   = {{colors.surface.default.hex_stripped}}e6
$surface90   = {{colors.surface.default.hex_stripped}}90
$dimFF       = {{colors.outline.default.hex_stripped}}ff
$dim         = {{colors.outline.default.hex_stripped}}

# matugen expone el path absoluto del wallpaper usado en esta corrida como
# variable de template -- lo mismo que aplica hyprpaper via
# wallpaper-selector.sh. Asi background.path de hyprlock.conf siempre queda
# sincronizado con el wallpaper activo, en vez de apuntar a un archivo fijo
# a mano.
$wallpaper   = {{image}}
