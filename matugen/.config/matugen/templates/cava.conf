# Generado por matugen -- no editar a mano, editar templates/cava.conf
# cava no tiene "include"/import para separar colores del resto del config
# (la opcion `theme` de [color] carga un archivo estatico de
# $HOME/.config/cava/themes, no algo regenerable en caliente por wallpaper)
# -- por eso esto ES la config completa de cava (igual que starship.toml/
# satty.toml), no solo una paleta separada.

[general]
autosens = 1
sensitivity = 100
framerate = 60

[input]
method = pulse
source = auto

[output]
method = noncurses
channels = stereo

[color]
# 'default' deja pasar el fondo/opacity+blur de la terminal detras (mismo
# mecanismo que background_opacity en kitty.conf) en vez de pintar un fondo
# solido encima.
background = 'default'
foreground = 'default'

gradient = 1
# Gradiente de identidad grave -> agudo (tertiary -> secondary -> primary):
# decorativo, sin colores de estado (principio 23).
gradient_color_1 = '{{colors.tertiary.default.hex}}'
gradient_color_2 = '{{colors.tertiary.default.hex}}'
gradient_color_3 = '{{colors.tertiary_container.default.hex}}'
gradient_color_4 = '{{colors.tertiary_container.default.hex}}'
gradient_color_5 = '{{colors.secondary.default.hex}}'
gradient_color_6 = '{{colors.primary.default.hex}}'
gradient_color_7 = '{{colors.primary.default.hex}}'
gradient_color_8 = '{{colors.primary_container.default.hex}}'

[smoothing]
noise_reduction = 77
