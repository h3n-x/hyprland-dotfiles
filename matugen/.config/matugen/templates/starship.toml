# Generado por matugen -- no editar a mano, editar templates/starship.toml
# TOML no tiene "source"/include como hyprlang, asi que a diferencia de otros
# templates este ES la config completa de starship (estructura + colores),
# no solo una paleta separada.

"$schema" = "https://starship.rs/config-schema.json"

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$cmd_duration
$character"""

add_newline = true
command_timeout = 500

[directory]
style = "bold fg:#{{colors.primary.default.hex_stripped}}"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
style = "fg:#{{colors.secondary.default.hex_stripped}}"
format = "[ $symbol$branch ]($style)"
symbol = " "

[git_status]
style = "fg:#{{colors.tertiary_container.default.hex_stripped}}"
format = "[($all_status$ahead_behind )]($style)"

[nodejs]
style = "fg:#{{colors.tertiary.default.hex_stripped}}"
format = "[ $symbol$version ]($style)"
symbol = " "

[python]
style = "fg:#{{colors.tertiary.default.hex_stripped}}"
format = "[ $symbol$version ]($style)"
symbol = " "

[rust]
style = "fg:#{{colors.tertiary.default.hex_stripped}}"
format = "[ $symbol$version ]($style)"
symbol = " "

[golang]
style = "fg:#{{colors.tertiary.default.hex_stripped}}"
format = "[ $symbol$version ]($style)"
symbol = " "

[cmd_duration]
style = "fg:#{{colors.on_surface_variant.default.hex_stripped}}"
format = "[ 󱦟 $duration ]($style)"
min_time = 2000

[character]
success_symbol = "[❯](bold fg:#{{colors.primary.default.hex_stripped}})"
error_symbol = "[❯](bold fg:#{{colors.error.default.hex_stripped}})"
vimcmd_symbol = "[❮](bold fg:#{{colors.secondary.default.hex_stripped}})"
