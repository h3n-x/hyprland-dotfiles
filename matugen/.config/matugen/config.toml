# ============================================================================
# matugen -- genera paletas Material You a partir de un wallpaper y las
# vuelca en cada app via templates. Se corre con `matugen image <wallpaper>`
# (lo hace hypr/.config/hypr/scripts/wallpaper-selector.sh en cada cambio de
# fondo). Ver README.md para el setup inicial.
# ============================================================================

[config]
# No usamos el `set_wallpaper` de matugen: el wallpaper lo aplica
# wallpaper-selector.sh via IPC de hyprpaper antes de llamar a matugen.

[templates.btop]
input_path = "~/.config/matugen/templates/btop.theme"
output_path = "~/.config/btop/themes/matugen.theme"

[templates.glow]
input_path = "~/.config/matugen/templates/glow-style.json"
output_path = "~/.cache/matugen/glow-style.json"
# glow.yml no tiene una clave "style" que funcione (probado: la ignora
# silenciosamente) -- glow SI respeta la variable de entorno GLOW_STYLE,
# exportada desde .zshrc apuntando siempre a esta ruta fija.

[templates.zellij]
input_path = "~/.config/matugen/templates/zellij-config.kdl"
output_path = "~/.config/zellij/config.kdl"
# Archivo completo (no solo el theme): `theme_dir` de zellij no expande
# `~`/$HOME, asi que no se puede apuntar de forma portable a un archivo de
# theme separado -- ver el comentario del template.

[templates.cava]
input_path = "~/.config/matugen/templates/cava.conf"
output_path = "~/.config/cava/config"
# Recarga solo los colores si cava ya esta corriendo (SIGUSR2), sin
# reiniciar el analisis de audio. pkill devuelve 1 (y sin esto abortaria el
# post_hook) si cava no esta abierto -- de ahi el `|| true`.
post_hook = "pkill -USR2 cava >/dev/null 2>&1 || true"

[templates.fastfetch]
input_path = "~/.config/matugen/templates/fastfetch-opts.sh"
output_path = "~/.cache/matugen/fastfetch-opts.sh"

[templates.satty]
input_path = "~/.config/matugen/templates/satty.toml"
output_path = "~/.config/satty/config.toml"

[templates.spicetify]
input_path = "~/.config/matugen/templates/spicetify-color.ini"
output_path = "~/.config/spicetify/Themes/matugen/color.ini"
# spicetify no lee color.ini en vivo -- lo "hornea" dentro de los archivos
# ya parcheados de Spotify recien en `spicetify apply`. Este post_hook deja
# los archivos parcheados al dia en cada cambio de wallpaper, pero Spotify
# (si esta abierto) no se reinicia solo -- hay que cerrarlo y abrirlo de
# nuevo para ver los colores nuevos.
post_hook = "spicetify apply >/dev/null 2>&1 || true"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty.conf"
output_path = "~/.config/kitty/colors.conf"
# Solo recolorea ventanas kitty ya abiertas si el hook corre dentro de una
# (KITTY_LISTEN_ON en el entorno); si no, simplemente no hace nada -- las
# ventanas nuevas ya toman colors.conf actualizado.
post_hook = "kitten @ set-colors -a -c ~/.config/kitty/colors.conf 2>/dev/null || true"

[templates.rofi]
input_path = "~/.config/matugen/templates/rofi.rasi"
output_path = "~/.config/rofi/colors.rasi"

[templates.hyprlock]
input_path = "~/.config/matugen/templates/hyprlock.conf"
output_path = "~/.config/hypr/colors.conf"

[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland-colors.lua"
output_path = "~/.config/hypr/modules/colors.lua"
post_hook = "hyprctl reload"

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.shell]
input_path = "~/.config/matugen/templates/shell.sh"
output_path = "~/.cache/matugen/colors.sh"

[templates.fzf]
input_path = "~/.config/matugen/templates/fzf.sh"
output_path = "~/.cache/matugen/fzf.sh"

[templates.qt5ct]
input_path = "~/.config/matugen/templates/qt-colors.conf"
output_path = "~/.config/qt5ct/colors/matugen.conf"

[templates.qt6ct]
input_path = "~/.config/matugen/templates/qt-colors.conf"
output_path = "~/.config/qt6ct/colors/matugen.conf"

[templates.starship]
input_path = "~/.config/matugen/templates/starship.toml"
output_path = "~/.config/starship.toml"

[templates.nvim]
input_path = "~/.config/matugen/templates/nvim-colors.lua"
output_path = "~/.config/nvim/lua/matugen_colors.lua"

[templates.yazi]
input_path = "~/.config/matugen/templates/yazi-flavor.toml"
output_path = "~/.config/yazi/flavors/matugen.yazi/flavor.toml"

[templates.sddm-main]
input_path = "~/.config/matugen/templates/sddm/Main.qml"
output_path = "~/.cache/matugen/sddm-theme/Main.qml"

[templates.sddm-clock]
input_path = "~/.config/matugen/templates/sddm/Components/Clock.qml"
output_path = "~/.cache/matugen/sddm-theme/Components/Clock.qml"

[templates.sddm-loginpanel]
input_path = "~/.config/matugen/templates/sddm/Components/LoginPanel.qml"
output_path = "~/.cache/matugen/sddm-theme/Components/LoginPanel.qml"

[templates.sddm-sessionpanel]
input_path = "~/.config/matugen/templates/sddm/Components/SessionPanel.qml"
output_path = "~/.cache/matugen/sddm-theme/Components/SessionPanel.qml"

[templates.sddm-passwordfield]
input_path = "~/.config/matugen/templates/sddm/Components/PasswordField.qml"
output_path = "~/.cache/matugen/sddm-theme/Components/PasswordField.qml"

[templates.sddm-userfield]
input_path = "~/.config/matugen/templates/sddm/Components/UserField.qml"
output_path = "~/.cache/matugen/sddm-theme/Components/UserField.qml"

[templates.sddm-powerbutton]
input_path = "~/.config/matugen/templates/sddm/Components/PowerButton.qml"
output_path = "~/.cache/matugen/sddm-theme/Components/PowerButton.qml"

[templates.sddm-rebootbutton]
input_path = "~/.config/matugen/templates/sddm/Components/RebootButton.qml"
output_path = "~/.cache/matugen/sddm-theme/Components/RebootButton.qml"

[templates.sddm-sleepbutton]
input_path = "~/.config/matugen/templates/sddm/Components/SleepButton.qml"
output_path = "~/.cache/matugen/sddm-theme/Components/SleepButton.qml"
# Unico post_hook del grupo sddm-*: copia el staging (~/.cache/matugen/sddm-theme/)
# a /usr/share/sddm/themes/ via sudo sin password. Apunta a una copia root-owned
# del script en /usr/local/bin (no al de este repo, que el usuario puede editar
# -- si el sudoers apuntara ahi, NOPASSWD equivaldria a sudo sin restricciones).
# Ver hypr/.config/hypr/scripts/sync-sddm-theme.sh (fuente) y README (setup).
post_hook = "sudo -n /usr/local/bin/sync-sddm-theme >/dev/null 2>&1 || true"

[templates.plymouth]
input_path = "~/.config/matugen/templates/plymouth.script"
output_path = "~/.cache/matugen/plymouth-theme/dotfiles-matugen.script"
# Genera el fondo (blur+vignette del wallpaper) y los frames del spinner (sin
# sudo, cache del usuario) y despues sincroniza+reconstruye el initramfs
# (root, script puntual via sudoers, igual que sync-sddm-theme -- ver README
# seccion Plymouth). {{image}} = path absoluto del wallpaper que esta
# procesando esta corrida de matugen. El rebuild de initramfs corre en
# background: unos segundos de disco, no bloquea el cambio de wallpaper.
post_hook = "~/.config/hypr/scripts/generate-plymouth-assets.sh {{colors.primary.default.hex_stripped}} {{image}} && (sudo -n /usr/local/bin/sync-plymouth-theme >/dev/null 2>&1 &) || true"

[templates.grub]
input_path = "~/.config/matugen/templates/grub-theme.txt"
output_path = "~/.cache/matugen/grub-theme/theme.txt"
# Genera fondo+avatar+tick (sin sudo, cache del usuario) y despues
# sincroniza+regenera grub.cfg (root, script puntual via sudoers, igual
# patron que sync-sddm/plymouth-theme -- ver README seccion GRUB). Mucho
# mas liviano que el post_hook de Plymouth: sin UKI de por medio, no hace
# falta backgroundearlo.
post_hook = "~/.config/hypr/scripts/generate-grub-assets.sh {{colors.primary.default.hex_stripped}} {{colors.tertiary.default.hex_stripped}} {{colors.on_primary.default.hex_stripped}} {{colors.surface_container.default.hex_stripped}} {{colors.outline_variant.default.hex_stripped}} {{image}} && sudo -n /usr/local/bin/sync-grub-theme >/dev/null 2>&1 || true"

[templates.quickshell]
# Ver quickshell/.config/quickshell/dotshell/ -- barra en QML (reemplazo
# de Waybar, ver README seccion Quickshell).
input_path = "~/.config/matugen/templates/quickshell-colors.qml"
output_path = "~/.config/quickshell/dotshell/Colors.qml"
post_hook = "qs -c dotshell ipc call colors reload >/dev/null 2>&1 || true"

[templates.icons]
# papirus-folders solo acepta nombres de color fijos, no hex -- el mapeo al
# mas cercano lo hace scripts/recolor-icons.sh. Necesita copias locales de
# Papirus y Papirus-Dark en ~/.local/share/icons/ para no pedir sudo (Papirus-
# Dark es simlinks relativos al tema base -- ver README).
input_path = "~/.config/matugen/templates/icon-color.txt"
output_path = "~/.cache/matugen/icon-color"
post_hook = "~/.config/hypr/scripts/recolor-icons.sh {{colors.primary.default.hex_stripped}}"
