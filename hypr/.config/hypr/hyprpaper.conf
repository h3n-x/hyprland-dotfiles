# ============================================================================
# hyprpaper -- https://wiki.hypr.land/hypr-ecosystem/user/hyprpaper/
# El bloque wallpaper{} vive en current-wallpaper.conf (generado, fuera del
# repo), que scripts/wallpaper-selector.sh reescribe en cada eleccion -- asi
# el wallpaper elegido persiste entre reinicios de Hyprland/sesion, no solo
# en vivo via IPC.
# ============================================================================

splash = false
ipc = true

source = ~/.config/hypr/current-wallpaper.conf
