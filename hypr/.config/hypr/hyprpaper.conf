# ============================================================================
# hyprpaper -- https://wiki.hypr.land/hypr-ecosystem/user/hyprpaper/
# El bloque wallpaper{} vive en current-wallpaper.conf (generado, fuera del
# repo), que scripts/theme-apply.sh reescribe en cada eleccion -- asi el
# wallpaper elegido persiste entre reinicios de Hyprland/sesion, no solo en
# vivo via IPC. Solo se usa con el backend hyprpaper (Fase 3 B6).
# ============================================================================

splash = false
ipc = true

source = ~/.config/hypr/current-wallpaper.conf
