# ============================================================================
# hyprlock -- https://wiki.hypr.land/hypr-ecosystem/user/hyprlock/
# Formato clasico hyprlang (INI), NO Lua -- es un proyecto separado de Hyprland core.
# Diseno de reloj de palabras, portado de hypr-rice. Colores generados por
# matugen (ver ../matugen/.config/matugen/), regenerados en cada cambio de
# wallpaper por scripts/wallpaper-selector.sh.
# ============================================================================

source = ~/.config/hypr/colors.conf

general {
    # disable_loading_bar, grace y no_fade_in ya no existen en hyprlock 0.9.x
    # (grace paso a ser el flag --grace de la CLI, ver scripts/lock.sh).
    hide_cursor = true
    ignore_empty_input = false
    fractional_scaling = 2 # auto
    fail_timeout = 2000
}

auth {
    pam:enabled = true
    fingerprint:enabled = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fade, 1, 3, linear
    animation = inputFieldColors, 1, 2, linear
    animation = inputFieldFade, 1, 2, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    # $wallpaper viene de colors.conf (generado por matugen, ver
    # ../matugen/.config/matugen/templates/hyprlock.conf) -- es el mismo
    # wallpaper que aplica hyprpaper, siempre sincronizado.
    path = $wallpaper
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.85
    brightness = 0.55
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# 1. IMAGEN DE USUARIO (arriba)
image {
    monitor =
    path = ~/.face
    size = 120
    rounding = 60
    border_size = 3
    border_color = rgba($primaryFF)
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba($primary40)
    position = 0, 290
    halign = center
    valign = center
}

# Icono de usuario de respaldo si ~/.face no existe (hyprlock no dibuja el
# widget `image` cuando el path no resuelve, asi que ambos pueden convivir)
label {
    monitor =
    text =
    color = rgba($primaryFF)
    font_size = 80
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba($primary40)
}

# 2. RELOJ DE PALABRAS MATRIZ (centro)
label {
    monitor =
    text = cmd[update:500] ~/.config/hypr/scripts/word_clock_matrix.sh
    color = rgba($primaryFF) # Color para las palabras resaltadas; el atenuado lo maneja el script
    font_size = 22
    font_family = JetBrains Mono Bold
    position = 0, 0
    halign = center
    valign = center
    text_align = center
    # markup (Pango) esta activo por defecto en todos los widgets desde
    # hyprlock 0.9.x, no existe mas como opcion propia
    shadow_passes = 5
    shadow_size = 12
    shadow_color = rgba($primary80)
    shadow_boost = 2.0
}

# Icono de candado (justo encima del campo de contraseña)
label {
    monitor =
    text =
    color = rgba($primaryFF)
    font_size = 32
    position = 0, -100
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba($primary40)
    shadow_boost = 1.5
}

# 3. CAMPO DE CONTRASEÑA (abajo)
input-field {
    monitor =
    size = 400, 55
    outline_thickness = 3
    dots_size = 0.3
    dots_spacing = 0.6
    dots_center = true
    dots_rounding = -1
    # Anillo con gradiente primary->primary_container. secondary quedaba
    # casi identico a primary en tono pastel (gradiente invisible); container
    # es bastante mas oscuro/saturado, se nota de verdad.
    outer_color = rgba($primaryAA) rgba($primaryContainerFF) 45deg
    inner_color = rgba($surfaceE6)
    font_color = rgba($onPrimaryFF)
    font_family = JetBrains Mono
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <span foreground="##$onPrimary" font_style="italic">Enter Password...</span>
    hide_input = false
    rounding = 20
    check_color = rgba($primaryFF)
    fail_color = rgba($dimFF)
    fail_text = <span foreground="##$dim" font_weight="bold"> Access Denied</span>
    capslock_color = rgba($dimFF)
    numlock_color = rgba($dimFF)
    bothlock_color = rgba($dimFF)
    position = 0, -260
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba($surface90)
}
