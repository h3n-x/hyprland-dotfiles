# ============================================================================
# hyprlock de EMERGENCIA (Fase 9 B1, D3) -- formato hyprlang, NO Lua.
# No es el bloqueo normal (ese es dotshell/lock.qml, ver scripts/lock): solo se usa
# si el bloqueo de Quickshell no llega a bloquear o se cae tres veces, con
# SUPER+CTRL+ALT+L (scripts/lock --emergency) o a mano desde una TTY (README,
# seccion Bloqueo de pantalla). A proposito sin tema ni archivos
# generados: sin matugen, sin wallpaper, sin scripts, para que nada externo
# pueda romperlo. Colores fijos y legibles (principio 23: recuperacion y
# bloqueo antes que adaptacion).
# ============================================================================

general {
    hide_cursor = false
    ignore_empty_input = true
    fail_timeout = 2000
}

auth {
    pam:enabled = true
    fingerprint:enabled = false
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgba(16, 16, 20, 1.0)
}

label {
    monitor =
    text = Bloqueo de emergencia
    color = rgba(230, 230, 235, 1.0)
    font_size = 20
    position = 0, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = Escribir la contraseña y Enter
    color = rgba(170, 170, 180, 1.0)
    font_size = 13
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(170, 170, 180, 1.0)
    inner_color = rgba(30, 30, 36, 1.0)
    font_color = rgba(230, 230, 235, 1.0)
    check_color = rgba(255, 212, 129, 1.0)  # warning fijo (palette status, oscuro)
    fail_color = rgba(255, 184, 175, 1.0)   # danger fijo (palette status, oscuro)
    fade_on_empty = false
    placeholder_text = Contraseña
    fail_text = Contraseña incorrecta ($ATTEMPTS)
    position = 0, -20
    halign = center
    valign = center
}
