# ============================================================================
# hypridle -- https://wiki.hypr.land/hypr-ecosystem/user/hypridle/
# ============================================================================

general {
    lock_cmd = pidof hyprlock || ~/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep = 2
}

# Bajar brillo de pantalla antes de bloquear
listener {
    timeout = 150 # 2.5 min
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Bloquear pantalla
listener {
    timeout = 300 # 5 min
    on-timeout = loginctl lock-session
}

# Apagar pantalla
listener {
    timeout = 330 # 5.5 min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

# Suspender (bateria: se ajusta con power-profiles-daemon aparte)
listener {
    timeout = 1200 # 20 min
    on-timeout = systemctl suspend
}
