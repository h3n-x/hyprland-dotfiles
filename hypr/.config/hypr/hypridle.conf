# ============================================================================
# hypridle -- https://wiki.hypr.land/hypr-ecosystem/user/hypridle/
# ============================================================================

general {
    # Bloqueo de Quickshell vigilado (Fase 9 B1). Sin --user: un evento de
    # inactividad con la sesion ya bloqueada no hace nada (flock).
    lock_cmd = ~/.config/hypr/scripts/lock
    before_sleep_cmd = loginctl lock-session
    # --resume: Hyprland no le devuelve el teclado a la superficie de bloqueo
    # que ya existia; el bloqueo se recrea (no cuenta como caida).
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; ~/.config/hypr/scripts/lock --resume
    # 3 = esperar a que la sesion este bloqueada antes de suspender
    # (2 = automatico, solo reconoce hyprlock en lock_cmd).
    inhibit_sleep = 3
}

# Bajar brillo de pantalla antes de bloquear
listener {
    timeout = 150 # 2.5 min
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Bloquear pantalla
listener {
    timeout = 300 # 5 min
    on-timeout = loginctl lock-session
}

# Apagar pantalla
listener {
    timeout = 330 # 5.5 min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

# Suspender (bateria: se ajusta con power-profiles-daemon aparte)
listener {
    timeout = 1200 # 20 min
    on-timeout = systemctl suspend
}
